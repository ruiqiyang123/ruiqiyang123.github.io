<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>九龙拉棺设计对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: #e9edf1; color: #17202a; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 6px; font-size: 24px; }
      p { margin: 0 0 22px; color: #61707e; }
      .comparison { display: grid; grid-template-columns: repeat(2, 320px); gap: 12px; align-items: start; }
      .panel { background: white; border: 1px solid #cbd4dc; border-radius: 16px; padding: 14px; box-shadow: 0 12px 32px rgba(20, 35, 50, 0.12); }
      .label { margin-bottom: 10px; font-size: 13px; font-weight: 800; }
      .source-crop { position: relative; width: 290px; height: 580px; overflow: hidden; background: #07131f; }
      .source-crop img { position: absolute; width: 1766px; height: auto; left: -611px; top: -218px; }
      .implementation { width: 290px; height: 580px; overflow: hidden; background: white; }
      iframe { display: block; width: 430px; height: 860px; transform: scale(0.674); transform-origin: top left; border: 0; background: white; }
    </style>
  </head>
  <body>
    <h1>视觉对比：选择药剂状态</h1>
    <p>左侧是抖音参考画面裁切，右侧是浏览器实际渲染。</p>
    <div class="comparison">
      <section class="panel">
        <div class="label">参考</div>
        <div class="source-crop"><img src="/assets/jiulong/reference-douyin.png" alt="抖音参考截图" /></div>
      </section>
      <section class="panel">
        <div class="label">实现</div>
        <div class="implementation"><iframe src="/" title="九龙拉棺实现"></iframe></div>
      </section>
    </div>
  </body>
</html>
